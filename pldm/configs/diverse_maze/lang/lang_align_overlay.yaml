# HWM_PLDM 원본 대비 추가된 실험 코드 (fork: slcnvly/HWM_PLDM, branch: lang-align).
#
# 원본 베이스라인(pldm/configs/diverse_maze/icml/large_diverse_25maps_l2.yaml)은
# 수정하지 않는다. 이 파일은 그 위에 레이어링하는 얇은 오버레이로,
# `objectives_l2.objectives` 리스트에 LangAlign을 추가하고 그 하위 섹션만 재정의한다.
# (OmegaConf 병합에서 리스트는 교체되므로 전체 리스트를 다시 적어야 한다.)
#
# 사용 예:
#   python -m pldm.train --configs \
#     pldm/configs/diverse_maze/icml/large_diverse_25maps_l2.yaml \
#     pldm/configs/diverse_maze/lang/lang_align_overlay.yaml \
#     --values objectives_l2.lang_align.global_coeff=0.1 \
#              objectives_l2.lang_align.mode=frozen \
#              output_dir=lang_frozen_c0.1 run_name=lang_frozen_c0.1
objectives_l2:
  objectives:
  - ObjectiveType.PredictionObs
  - ObjectiveType.PredictionProprio
  - ObjectiveType.LangAlign
  lang_align:
    global_coeff: 0.1
    mode: frozen
    model_name: sentence-transformers/all-MiniLM-L6-v2
    text_lr_scale: 0.05
    freeze_text_steps: 500
    proj_dim: 32
    z_proj_arch: '64'
    t_proj_arch: '256'
    temperature: 0.07
    learnable_temp: true
    mag_bins: [0.25, 0.9]
    n_directions: 8
    t2z_coeff: 1.0
    text_dispersion_coeff: 1.0
